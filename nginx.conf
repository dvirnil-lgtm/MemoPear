# Legacy domain: permanently redirect every go.memopear.com request to the
# canonical memopear.com origin, preserving the full path and query string.
# Cloud Run routes all mapped hosts to this same container, so a Host-based
# server block is enough to catch go.memopear.com traffic. The redirect target
# is a hardcoded absolute https URL, so it is unaffected by absolute_redirect
# off (which only governs nginx's own generated redirects) and by Cloud Run
# terminating TLS upstream (nginx itself only ever sees http on 8080).
server {
    listen 8080;
    server_name go.memopear.com;
    return 301 https://memopear.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run terminates TLS and proxies plain HTTP to this container on
    # 8080, so nginx's own scheme/port are never what the client actually
    # connected on. Without this, nginx's automatic directory redirects
    # (e.g. /blog -> /blog/, since the prerendered build has a real blog/
    # directory) build an absolute Location header using its own view of
    # scheme+port, producing unreachable URLs like http://host:8080/blog/.
    # Relative redirects let the browser resolve against the real origin.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
